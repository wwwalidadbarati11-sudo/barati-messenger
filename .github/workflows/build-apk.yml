
name: Build BARATI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p "$RUNNER_TEMP/barati"
          unzip -q BaratiMessenger_Starter.zip -d "$RUNNER_TEMP/barati"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$RUNNER_TEMP/barati" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barati-debug-apk
          path: ${{ runner.temp }}/barati/app/build/outputs/apk/debug/app-debug.apk
