
name: Build BARATI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p "$RUNNER_TEMP/barati"
          unzip -q BaratiMessenger_Starter.zip -d "$RUNNER_TEMP/barati"

      - name: Fix Java and Kotlin versions
        env:
          PROJECT_DIR: ${{ runner.temp }}/barati
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()
          old = "    buildFeatures { compose = true }"
          new = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }"""
          if old not in s:
              raise SystemExit("Could not find buildFeatures line")
          p.write_text(s.replace(old, new))
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Get SHA fingerprints  
        run: ./gradlew signingReport
        run:: 
        run: 

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barati-debug-apk
          path: ${{ runner.temp }}/barati/app/build/outputs/apk/debug/app-debug.apk
