
name: Build BARATI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/barati"
          unzip -o BaratiMessenger_Starter.zip -d "$RUNNER_TEMP/barati"

          PROJECT_DIR=$(find "$RUNNER_TEMP/barati" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT_DIR"
                - name: Create valid Android Manifest
        run: |
          cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="BARATI MESSENGER"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name="com.barati.messenger.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Copy Firebase config
        run: |
          CONFIG_FILE=$(find . -type f -iname 'google-services.json' -not -path './.git/*' | head -n 1)

          if [ -z "$CONFIG_FILE" ]; then
            echo "ERROR: google-services.json not found"
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found Firebase config: $CONFIG_FILE"
          cp "$CONFIG_FILE" "$PROJECT_DIR/app/google-services.json"
          echo "Firebase config copied successfully"

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          s = p.read_text()

          old = "    buildFeatures { compose = true }"

          new = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }"""

          if old in s:
              p.write_text(s.replace(old, new))
              print("Java and Kotlin versions updated")
          else:
              print("Existing buildFeatures line not found; leaving file unchanged")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.config/.android"

          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get SHA fingerprints
        run: gradle -p "$PROJECT_DIR" signingReport --console=plain

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barati-debug-apk
          path: ${{ runner.temp }}/barati/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
